  <style>
    .bg{fill:#ffffff}.edge{stroke:#d0d7de}.title{fill:#0969da}.muted{fill:#59636e}
    @media (prefers-color-scheme: dark){.bg{fill:#0d1117}.edge{stroke:#30363d}.title{fill:#4493f8}.muted{fill:#9198a1}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  </style>
  <rect x="0.5" y="0.5" width="599" height="149" rx="12" class="bg edge"/>
  <text x="28" y="48" class="title" font-size="22" font-weight="600">toolnest</text>
  <text x="28" y="82" class="muted" font-size="15">Developer toolbox that runs entirely in the browser.</text>
  <text x="28" y="104" class="muted" font-size="15">No account, no tracking, no ads.</text>
  <circle cx="34" cy="127" r="6" fill="#3178c6"/>
